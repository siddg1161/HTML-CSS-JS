<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
             .container {
               width: 100vw;
               height: 100vh;
            background-image: linear-gradient(105.9deg, rgba(0,122,184,1) 24.4%, rgba(46,0,184,0.88) 80.5%);
            display: flex;
            align-items: center;
           justify-content: center;
              }

        .card {
            width: 400px;
            height: 600px;
            background-color: aliceblue;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 20px;
            gap: 15px;
        }
        .card img {
            width: 100%;
            height: 30%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .textBox{
            display: flex;
            align-items: center;
            gap: 15px;
            flex-direction: column;
            width:80%;
            text-align: center;
        }
        #amountBox{
            width: 80%;
            height: 10%;
            background-color: rgb(73, 170, 225);
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 20px;
            padding-left: 20px;

        }
        #PaymentButton{
            height: 9%;
            width: 80%;
            background-color: rgba(209, 35, 192, 0.564);
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
            
        }
        .cancelBox a{
            text-decoration: none;
            color: rgb(0, 0, 0);
            font-weight: bold;
            font-size: large;
        }
        .leftBox{
           
              display: flex;
              gap: 15px;
              height: 100%;
              align-items: center;
        }
        .rightBox{

        }
        .imgBox{
            
            width: 3rem;
        }
        
    </style>
</head>

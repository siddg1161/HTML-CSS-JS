<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Student Information</legend>
    <form>
        <label for="Email">Enter Email</label>
        <input type="text" id="Email" placeholder="Enter email here">
        <br>
        <label for="Password">Enter Password</label>
        <input type="text" id="Password">
        <br>
        <input type="submit" value="Click here">
        <br>
        <label for="date">Enter DOB</label>
        <input type="date" id="date">
        <br>
        <label for="Dishes">Enter your dish:</label>
        <select name="Dishes" id="Dishes">
            <option value="paneer">paneer</option>
            <option value="Garlic nana">Garlic nan</option>
            <option value="Dal Makhani">Dal Makhani</option>
        </select>
        <br>
        <textarea name="TextArea" id="text" rows="15" cols="30" placeholder="Enter Text"></textarea>
    </form>
    </fieldset>
</body>
</html>
